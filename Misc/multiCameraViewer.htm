<!DOCTYPE html>

<!--

  Displays camera feeds in resizable and zoomable windows
  with motion detection.
  
  This was an experiment to see what could be acheived using
  A.I. to write all the code.
  
  Note: Motion detection will only function whilst the window
        is visible (set it to always on top to ensure it stays active)

  Add camera IPs under "ADD YOUR CAMERA IPs HERE"
  
  Modify load settings keys under 'load settings with keypress'
  default detection timer under "// Timer properties"
  
  Specify config on url:  http://x.x.x.x?config=xxx
  
  Note: uses misc/interact.min.js from https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js
  
                                               10Oct26
-->


<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Camera Viewer</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        /* Basic styles for the entire page */
        body {
            margin: 0;
            background: #111;
            overflow: hidden;
            font-family: sans-serif;
        }
        /* security lights */
        #lights {
          color: #05F;
          position: fixed; /* stays relative to the viewport */
          bottom: 3px;     /* distance from bottom edge */
          right: 8px;      /* distance from right edge */         
          display: none;            /* initially hide the buttons - press 'b' to display them */   
        }
        .lightLink:hover {
          color: #099;
        }
        /* Styles for the button toolbar at the bottom of screen */
        #toolbar {
            position: relative;
            background: transparent;
            width: 100%;
            height: 0;
            overflow: visible;
            display: none;            /* initially hide the buttons - press 'b' to display them */
        }
        /* Styles for buttons within the toolbar */
        #toolbar button {
            margin-right: 5px;
            padding: 5px 10px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }       
        #toolbar button:hover {
          color: #666;
        }        
        /* Styles for the containers holding each camera image */
        .img-container {
            position: absolute;
            border: 2px solid #444;
            overflow: hidden;
            user-select: none;
            z-index: 1;
            background: #000;
        }
        .img-container.active {
            z-index: 1000;
        }
        /* Green = motion detection enabled & active timer; amber = detector error; red = motion detected. */
        .img-container.motion-enabled {
            border-color: #20c56b;
            box-shadow: 0 0 0 2px rgba(32, 197, 107, 0.8);
        }
        .img-container.motion-error {
            border-color: #ffb020;
            box-shadow: 0 0 0 2px rgba(255, 176, 32, 0.9);
        }
        .img-container.motion-triggered {
            border-color: #ff2929;
            box-shadow: 0 0 0 2px rgba(255, 41, 41, 0.95);
        }
        /* Styles for the inner div used for zoom/pan */
        .img-inner {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
            overflow: hidden;
        }
        .img-inner img {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            user-select: none;
            pointer-events: none;
        }
        /* Styles for the close button */
        .close-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0,0,0,0.45);
            color: #fff;
            border: none;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }
        /* Styles for the camera title */
        .cam-title {
            position: absolute;
            top: 4px;
            left: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            background: rgba(0,0,0,0.4);
            padding: 2px 6px;
            font-size: 16px;
            z-index: 10;
            pointer-events: auto;
            white-space: nowrap;
        }
        .cam-title input[type="checkbox"] {
            width: 13px;
            height: 13px;
            margin: 0;
            cursor: pointer;
            flex: 0 0 auto;
            accent-color: #20c56b;
        }
        /* Motion sensitivity remains available when motion detection is enabled. */
        .motion-controls {
            position: absolute;
            top: 30px;
            left: 5px;
            background: transparent;
            padding: 0;
            border-radius: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            opacity: 0.9;
            white-space: nowrap;
        }
        .motion-controls input[type="range"] {
            width: 100px;
            height: 10px;
            cursor: pointer;
            display: none; /* Hidden by default */
            margin: 0;
            vertical-align: middle;
        }
         .motion-controls input[type="range"].visible {
            display: inline-block; /* Show when checkbox is checked */
         }
        .motion-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 14px;
            border-radius: 5px;
            background-color: rgba(220, 20, 20, 0.94);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.04em;
            white-space: nowrap;
            display: none; /* Shown briefly when motion is detected */
            z-index: 100;
            pointer-events: none; /* Allow clicks through */
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
            animation: pulse 0.5s infinite alternate;
        }
        .motion-indicator::after { content: "MOTION DETECTED"; }
        @keyframes pulse {
            from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            to   { transform: translate(-50%, -50%) scale(1.04); opacity: 0.8; }
        }
        /* Timer styles */
        .timer-controls {
            position: absolute;
            top: 49px;
            left: 5px;
            padding: 5px;
            border-radius: 3px;
            z-index: 10;
            color: #00A;
            font-size: 12px;
            display: none; /* Hidden by default */
            color: #ff9900;
            background-color: rgb(128,128,128);
            opacity: 0.85;
        }
        .timer-controls.visible {
            display: block;
        }
        .timer-controls input {
            width: 40px;
            margin-left: 5px;
            border: 1px solid #555;
        }
        .timer-display {
            margin-left: 10px;
            font-weight: bold;
        }
        .timer-controls button {
            margin-left: 5px;
            padding: 2px 6px;
            border: none;
            cursor: pointer;
            font-size: 10px;
        }
    </style>
</head>
<body>
<div id="toolbar"></div>
<script src="misc/interact.min.js"></script>
<script>

    // CAMERAS - ADD YOUR CAMERA IPs HERE
    const cameras = [
        { src: "http://x.x.x.x/jpg", id: "Cam1" },
        { src: "http://x.x.x.x/jpg", id: "Cam2" }
    ];
    
    
    let isShiftPressed = false;
    let audioContext = null; // Global AudioContext
    let lastBeepTime = 0;
    const beepCooldown = 2000; // 2 second cooldown
    

    // --- MOTION HISTORY STORAGE ---
    const motionHistory = [];
    const MAX_HISTORY = 10;

    function showMotionHistory() {
        const existingOverlay = document.getElementById('motion_history_overlay');
        if (existingOverlay) existingOverlay.remove();

        const overlay = document.createElement('div');
        overlay.id = 'motion_history_overlay';
        overlay.style.cssText = `
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        `;

        const dialog = document.createElement('div');
        dialog.style.cssText = `
            background: #222;
            color: white;
            padding: 20px;
            border-radius: 8px;
            width: 90vw;
            max-width: 700px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 25px rgba(0,0,0,0.7);
        `;

        const header = document.createElement('div');
        header.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;';
        header.innerHTML = `<h3 style="margin: 0; color: #20c56b;">Motion Detection History</h3>`;
        
        const closeTop = document.createElement('button');
        closeTop.textContent = '×';
        closeTop.style.cssText = 'background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;';
        closeTop.onclick = () => overlay.remove();
        header.appendChild(closeTop);
        dialog.appendChild(header);

        const listContainer = document.createElement('div');
        listContainer.style.cssText = 'flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px;';

        if (motionHistory.length === 0) {
            listContainer.innerHTML = `<p style="text-align: center; color: #888; padding: 40px 0;">No motion events recorded yet.</p>`;
        } else {
            motionHistory.forEach((item) => {
                const card = document.createElement('div');
                card.style.cssText = `
                    display: flex;
                    align-items: center;
                    background: #1a1a1a;
                    border: 1px solid #444;
                    border-radius: 6px;
                    padding: 10px;
                    gap: 15px;
                `;

                const img = document.createElement('img');
                img.src = item.dataUrl;
                img.style.cssText = 'width: 120px; height: 90px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #333;';
                img.onclick = () => {
                    const w = window.open('');
                    w.document.write(`<img src="${item.dataUrl}" style="max-width:100%; background:#000;" alt="Motion Snapshot"/>`);
                };

                const info = document.createElement('div');
                info.style.cssText = 'flex: 1; display: flex; flex-direction: column; gap: 4px;';
                info.innerHTML = `
                    <div style="font-weight: bold; color: #ff2929; font-size: 15px;">${item.camId} Camera</div>
                    <div style="font-size: 13px; color: #ccc;">Detected at: ${item.time} (${item.date})</div>
                `;

                const actions = document.createElement('div');
                actions.style.cssText = 'display: flex; gap: 8px;';

                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = 'Download';
                downloadBtn.style.cssText = 'background: #20c56b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;';
                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = item.dataUrl;
                    a.download = `motion_${item.camId.toLowerCase()}_${item.time.replace(/:/g, '-')}.jpg`;
                    a.click();
                };

                actions.appendChild(downloadBtn);
                card.appendChild(img);
                card.appendChild(info);
                card.appendChild(actions);
                listContainer.appendChild(card);
            });
        }

        dialog.appendChild(listContainer);

        const footer = document.createElement('div');
        footer.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;';

        const clearBtn = document.createElement('button');
        clearBtn.textContent = 'Clear History';
        clearBtn.style.cssText = 'background: #444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;';
        clearBtn.onclick = () => {
            motionHistory.length = 0;
            overlay.remove();
            showMotionHistory();
        };

        const closeBtn = document.createElement('button');
        closeBtn.textContent = 'Close';
        closeBtn.style.cssText = 'background: #333; color: white; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer;';
        closeBtn.onclick = () => overlay.remove();

        footer.appendChild(clearBtn);
        footer.appendChild(closeBtn);
        dialog.appendChild(footer);

        overlay.appendChild(dialog);
        document.body.appendChild(overlay);
    }
    // --- END MOTION HISTORY ---

    // --- DEBUGGING ---
    const DEBUG_MOTION = false; // Set to true to enable detailed motion logs
    function debugLog(message) {
        if (DEBUG_MOTION) {
            console.log(`[${new Date().toLocaleTimeString()}] ${message}`);
        }
    }
    // --- END DEBUGGING ---
    // load settings with keypress ('r' and 'b' unavailable)
    const keyConfigMap = [
        { key: 'm', config: 'main' },
        { key: 's', config: 'small' },
        { key: 'f', config: 'front' },
    ];
    window.addEventListener('keydown', e => {
        if (e.key === 'Shift') isShiftPressed = true;
        const target = e.target;
        const typing = target && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));
        if (typing) return;
        if (e.key === 'b') {
            // buttons
            const tb = document.getElementById('toolbar');
            const tbDisplay = window.getComputedStyle(tb).display;
            tb.style.display = (tbDisplay === 'none' || tb.style.display === 'none') ? 'block' : 'none';
            // security lights
            const tc = document.getElementById('lights');
            const tcDisplay = window.getComputedStyle(tc).display;
            tc.style.display = (tcDisplay === 'none' || tc.style.display === 'none') ? 'block' : 'none';            
        }
        if (e.key === 'r') resetCameras();
        const match = keyConfigMap.find(item => e.key === item.key);
        if (match) {
            const data = localStorage.getItem('cameraState_' + match.config);
            if (data) {
                // resetCameras(); // loadState will handle resetting
                localStorage.setItem('cameraState', data); // Set the active state
                loadState();
            }
        }
    });
    window.addEventListener('keyup', e => { if (e.key === 'Shift') isShiftPressed = false; });
    window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    
    

    // cameras
    const toolbar = document.getElementById('toolbar');
    const camButtonContainer = document.createElement('span');
    camButtonContainer.style.position = 'fixed';
    camButtonContainer.style.bottom = '10px';
    camButtonContainer.style.left = '10px';
    camButtonContainer.style.zIndex = '2000'; // Ensure toolbar buttons are above camera windows
    toolbar.appendChild(camButtonContainer);

    cameras.forEach(cam => {
        const btn = document.createElement('button');
        btn.textContent = cam.id;
        btn.onclick = () => createCameraWindow(cam);
        camButtonContainer.appendChild(btn);
    });
    function createButton(text, onClick, marginLeft = '5px') {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.onclick = onClick;
        btn.style.marginLeft = marginLeft;
        camButtonContainer.appendChild(btn);
        return btn;
    }
    createButton('Save', () => {
        const name = prompt('Enter config name:');
        if (name) localStorage.setItem('cameraState_' + name, localStorage.getItem('cameraState'));
    }, '20px');
    createButton('Load', () => {
        const name = prompt('Enter config name:');
        if (!name) return;
        const data = localStorage.getItem('cameraState_' + name);
        if (data) {
            localStorage.setItem('cameraState', data); // Set the active state to be loaded
            loadState();
        } else {
            alert(`Config "${name}" not found.`);
        }
    });
    createButton('Export', () => {
        // Find all named configurations currently saved in localStorage.
        const configs = Object.keys(localStorage)
            .filter(key => key.startsWith('cameraState_'))
            .map(key => ({
                key: key,
                name: key.substring('cameraState_'.length)
            }))
            .sort((a, b) => a.name.localeCompare(b.name));

        if (configs.length === 0) {
            alert('No saved configurations to export.');
            return;
        }

        // Build a simple selection dialog.
        const overlay = document.createElement('div');
        overlay.style.cssText = `
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        `;

        const dialog = document.createElement('div');
        dialog.style.cssText = `
            background: #222;
            color: white;
            padding: 20px;
            border-radius: 6px;
            min-width: 300px;
            max-width: 90vw;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        `;

        const title = document.createElement('h3');
        title.textContent = 'Select configurations to export';
        title.style.marginTop = '0';
        dialog.appendChild(title);

        const list = document.createElement('div');
        list.style.cssText = 'max-height: 400px; overflow-y: auto; margin: 10px 0 15px;';

        configs.forEach(config => {
            const label = document.createElement('label');
            label.style.cssText = 'display:block; padding:5px; cursor:pointer;';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = config.key;
            checkbox.checked = true;
            checkbox.style.marginRight = '8px';

            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(config.name));
            list.appendChild(label);
        });

        dialog.appendChild(list);

        const buttonRow = document.createElement('div');
        buttonRow.style.cssText = 'display:flex; gap:8px; justify-content:flex-end;';

        const selectAll = document.createElement('button');
        selectAll.textContent = 'Select All';
        selectAll.onclick = () => list.querySelectorAll('input').forEach(cb => cb.checked = true);

        const selectNone = document.createElement('button');
        selectNone.textContent = 'Select None';
        selectNone.onclick = () => list.querySelectorAll('input').forEach(cb => cb.checked = false);

        const cancel = document.createElement('button');
        cancel.textContent = 'Cancel';
        cancel.onclick = () => overlay.remove();

        const exportSelected = document.createElement('button');
        exportSelected.textContent = 'Export Selected';
        exportSelected.onclick = () => {
            const selected = [...list.querySelectorAll('input:checked')];

            if (selected.length === 0) {
                alert('Please select at least one configuration.');
                return;
            }

            // Store all selected configurations together in one JSON file.
            const exportData = {};
            selected.forEach(cb => {
                exportData[cb.value.substring('cameraState_'.length)] =
                    JSON.parse(localStorage.getItem(cb.value));
            });

            const blob = new Blob([JSON.stringify(exportData, null, 2)], {
                type: 'application/json'
            });

            const a = document.createElement('a');
            const downloadUrl = URL.createObjectURL(blob);
            a.href = downloadUrl;
            a.download = 'camera_configs.json';
            a.click();
            // Delayed revocation avoids interrupting browsers that start downloads asynchronously.
            setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
            overlay.remove();
        };

        buttonRow.appendChild(selectAll);
        buttonRow.appendChild(selectNone);
        buttonRow.appendChild(cancel);
        buttonRow.appendChild(exportSelected);
        dialog.appendChild(buttonRow);

        overlay.appendChild(dialog);
        document.body.appendChild(overlay);
    });
    createButton('Import', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json';
        input.onchange = () => {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const imported = JSON.parse(e.target.result);

                    // Multi-config export: restore every named configuration.
                    // A single-layout export maps camera IDs to arrays. A multi-config
                    // export maps config names to state objects, so exclude arrays here.
                    const isMultiConfig = imported &&
                        typeof imported === 'object' &&
                        !Array.isArray(imported) &&
                        Object.values(imported).every(value =>
                            value && typeof value === 'object' && !Array.isArray(value)
                        );

                    if (isMultiConfig) {
                        Object.entries(imported).forEach(([name, state]) => {
                            localStorage.setItem(
                                'cameraState_' + name,
                                JSON.stringify(state)
                            );
                        });

                        alert(`Imported ${Object.keys(imported).length} configuration(s).`);
                    } else {
                        // Backwards compatibility with the original single-state export.
                        localStorage.setItem('cameraState', e.target.result);
                        loadState();
                    }
                } catch (err) {
                    alert('Error parsing JSON file: ' + err.message);
                }
            };

            reader.onerror = () => alert('Error reading file.');
            reader.readAsText(file);
        };
        input.click();
    });
    createButton('History', showMotionHistory, '20px');
    createButton('Reset', resetCameras, '20px');
    createButton('About', showInstructions, '20px');
    function showInstructions() {
        alert(`CCTV Camera Viewer with Motion Detection
          - Click camera button to open its feed.
          - Save/Load/Import/Export configuration.
          - Drag/Resize windows.
          - SHIFT + Scroll to zoom, SHIFT + drag to pan.
          - Motion Detection: Use the checkbox beside the camera name; a green border means detection is active and timer is running.
            A red alert appears when motion is detected; an amber border indicates a detector error.
            Detection analyses only the visible part of the image, including zoom and pan.
          - Images always stretch to fill each window when it is resized.
          - Timer: Set countdown (1-120 mins) when motion is enabled.
            Timer will auto-disable motion when it reaches zero.
          - 'b' hide/show the toolbar.
          - Quick load configs: 
            'm' Main, 's' Side, 'f' Front.
          - 'r'/Reset close all feeds.
          - Specify config on URL: ?config=
        `);
    }
    function stopCameraWindow(container) {
        const state = container?._zoomPanState;
        if (!state) return;
        state.isActive = false;
        state.isPanning = false;
        if (state.timerInterval) {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
        }
        if (state.abortController) state.abortController.abort();
        if (typeof state.stopFetching === 'function') state.stopFetching();
        if (state.interactable && typeof state.interactable.unset === 'function') {
            state.interactable.unset();
        }
    }
    function closeCameraWindow(buttonElement) {
        const container = buttonElement.parentElement;
        if (container) {
            debugLog(`Closing camera ${container.id}.`);
            stopCameraWindow(container);
            container.remove();
        }
        saveState();
    }
    function resetCameras() {
        debugLog('Resetting all cameras.');
        document.querySelectorAll('.img-container').forEach(el => {
            stopCameraWindow(el);
            el.remove();
        });
        localStorage.removeItem('cameraState'); // Clears the *active* saved state
    }

    function saveState() {
        const stateToSave = {};
        document.querySelectorAll('.img-container').forEach(c => {
            if (!c._zoomPanState) return; // Should not happen if initialized
            const s = c._zoomPanState;
            const id = c.getAttribute('data-cam-id');
            stateToSave[id] = stateToSave[id] || [];
            stateToSave[id].push({
                left: c.style.left, top: c.style.top,
                width: c.style.width, height: c.style.height,
                scale: s.scale, panX: s.panX, panY: s.panY,
                uniqueId: c.id,
                motionEnabled: s.motionEnabled,
                motionSensitivity: s.motionSensitivity,
                timerMinutes: s.timerMinutes,
                timerSeconds: s.timerSeconds,
                timerActive: s.timerActive,
                stretch: s.stretch
            });
        });
        localStorage.setItem('cameraState', JSON.stringify(stateToSave));
        debugLog('State saved.');
    }
    function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
    }
    function loadState(configName) {
        debugLog('Loading state...');
        // Clear existing cameras
        document.querySelectorAll('.img-container').forEach(el => {
            stopCameraWindow(el);
            el.remove();
        });
        // Prefer the URL-selected configuration; fall back to the active layout if it is missing.
        const stateString = configName
            ? (localStorage.getItem('cameraState_' + configName) || localStorage.getItem('cameraState'))
            : localStorage.getItem('cameraState');
        if (!stateString) {
            debugLog('No state found to load.');
            return;
        }
        let stateToLoad;
        try {
            stateToLoad = JSON.parse(stateString);
            if (!stateToLoad || typeof stateToLoad !== 'object' || Array.isArray(stateToLoad)) {
                throw new Error('Configuration must be an object.');
            }
        } catch (e) {
            console.error("Error parsing saved state:", e);
            alert("Error loading saved state: " + e.message);
            return;
        }
        for (const camDef of cameras) {
            const windows = Array.isArray(stateToLoad[camDef.id]) ? stateToLoad[camDef.id] : [];
            windows.forEach(cfg => {
                if (cfg && typeof cfg === 'object' && !Array.isArray(cfg)) createCameraWindow(camDef, cfg);
            });
        }
        debugLog('State loaded.');
    }

    function initAudio() {
        if (!audioContext) {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                debugLog("AudioContext initialized.");
            } catch (e) {
                console.error("Web Audio API is not supported in this browser");
                return; // Important to return if context fails
            }
        }
         if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume().then(() => debugLog("AudioContext resumed."))

    function compareFrames(ctx1, ctx2, width, height, sensitivity, containerId = "unknown_cam") {
        const first = ctx1.getImageData(0, 0, width, height).data;
        const second = ctx2.getImageData(0, 0, width, height).data;
        const pixelCount = width * height;
        const deltas = new Int16Array(pixelCount);
        const deltaHistogram = new Uint32Array(511); // Signed luminance differences: -255..255.

        // Use perceptual luminance rather than an unweighted RGB average.
        for (let pixel = 0, offset = 0; pixel < pixelCount; pixel++, offset += 4) {
            const gray1 = 0.2126 * first[offset] + 0.7152 * first[offset + 1] + 0.0722 * first[offset + 2];
            const gray2 = 0.2126 * second[offset] + 0.7152 * second[offset + 1] + 0.0722 * second[offset + 2];
            const delta = Math.max(-255, Math.min(255, Math.round(gray2 - gray1)));
            deltas[pixel] = delta;
            deltaHistogram[delta + 255]++;
        }

        // Remove the median whole-frame brightness shift. This reduces false alarms caused
        // by auto-exposure, light changes and mild flicker affecting most of the image.
        const midpoint = Math.floor(pixelCount / 2);
        let accumulated = 0;
        let baselineDelta = 0;
        for (let bin = 0; bin < deltaHistogram.length; bin++) {
            accumulated += deltaHistogram[bin];
            if (accumulated > midpoint) {
                baselineDelta = bin - 255;
                break;
            }
        }

        const sensitivityValue = Math.max(1, Math.min(100, Number(sensitivity) || 50));
        const sensitivityFraction = (sensitivityValue - 1) / 99;
        // High slider values lower both the per-pixel threshold and the changed-area requirement.
        // These thresholds are more responsive than the previous defaults, particularly at mid-range sensitivity.
        const pixelThreshold = 24 - (13 * sensitivityFraction); // 24 at low sensitivity, 11 at high.
        const requiredRatio = 0.060 - (0.052 * sensitivityFraction); // 6% down to 0.8% of sampled pixels.
        const requiredDiffPixels = Math.max(12, Math.ceil(pixelCount * requiredRatio));
        let diffCount = 0;
        for (let pixel = 0; pixel < pixelCount; pixel++) {
            if (Math.abs(deltas[pixel] - baselineDelta) >= pixelThreshold) diffCount++;
        }

        const motionDetected = diffCount >= requiredDiffPixels;
        if (DEBUG_MOTION) {
            debugLog(`[${containerId}] changed=${diffCount}/${pixelCount}, required=${requiredDiffPixels}, threshold=${pixelThreshold.toFixed(1)}, detected=${motionDetected}`);
        }
        return motionDetected;
    }

                            } else {
                                state.motionHitStreak = 0;
                            }
                        } else {
                            prevImageLoaded = true;
                        }
                    } catch (error) {
                        state.motionHitStreak = 0;
                        prevImageLoaded = false;
                        container.classList.add('motion-error');
                        if (!state.motionDetectionError) {
                            console.error(`[${container.id}] Motion detection failed. Check camera CORS/canvas access.`, error);
                        }
                        state.motionDetectionError = true;
                    }
                }
                if (motionIndicator.style.display === 'block' && (Date.now() - state.lastMotionTime > 1100)) {
                    motionIndicator.style.display = 'none';
                    container.classList.remove('motion-triggered');
                }
                if (state.pendingStretchMigration && state.imgNaturalWidth > 0 && state.imgNaturalHeight > 0) {
                    const oldFitScale = Math.min(
                        inner.clientWidth / state.imgNaturalWidth,
                        inner.clientHeight / state.imgNaturalHeight
                    );
                    if (oldFitScale > 0) {
                        const zoomFactor = state.scale / oldFitScale;
                        const panScaleX = inner.clientWidth / (state.imgNaturalWidth * oldFitScale);
                        const panScaleY = inner.clientHeight / (state.imgNaturalHeight * oldFitScale);
                        state.scale = Math.min(10, Math.max(0.1, zoomFactor));
                        state.panX *= panScaleX;
                        state.panY *= panScaleY;
                    } else {
                        state.scale = 1;
                        state.panX = 0;
                        state.panY = 0;
                    }
                    state.pendingStretchMigration = false;
                    state.initialized = true;
                    state.lastInnerWidth = inner.clientWidth;
                    state.lastInnerHeight = inner.clientHeight;
                    clampPan();
                    updateImageTransform(img, state);
                    saveState();
                } else if (!state.initialized && state.imgNaturalWidth > 0) {
                    state.scale = 1;
                    state.panX = 0;
                    state.panY = 0;
                    state.initialized = true;
                    state.lastInnerWidth = inner.clientWidth;
                    state.lastInnerHeight = inner.clientHeight;
                    updateImageTransform(img, state);
                    saveState();
                } else if (state.initialized) {
                    state.lastInnerWidth = inner.clientWidth;
                    state.lastInnerHeight = inner.clientHeight;
                    updateImageTransform(img, state);
                }

                if (state.isActive) {
                    fetchTimeoutId = setTimeout(fetchNextFrame, 600);
                }
            };
            tempImg.onerror = () => {
                if (requestTimedOut || !state.isActive) {
                    if (!state.isActive) debugLog(`[${container.id}] tempImg.onerror: state became inactive during load/error.`);
                     clearTimeout(requestTimeoutId);
                    return;
                }
                clearTimeout(requestTimeoutId);
                if (state.activeRequestTimeoutId === requestTimeoutId) state.activeRequestTimeoutId = null;
                if (state.activeImageRequest === tempImg) state.activeImageRequest = null;
                debugLog(`[${container.id}] Error loading camera image.`);
                let errorOverlay = container.querySelector('.error-overlay');
                if (!errorOverlay) {
                    errorOverlay = document.createElement('div');
                    errorOverlay.className = 'error-overlay';
                    errorOverlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0.5);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;z-index:100;pointer-events:none;';
                    errorOverlay.textContent = 'Camera Error';
                    container.appendChild(errorOverlay);
                }
                if (state.isActive) {
                    fetchTimeoutId = setTimeout(fetchNextFrame, 2000);
                }
            };
            tempImg.src = imgUrl;
        }
        fetchNextFrame();
    }
    // Initial load of state from localStorage when the page loads
    const startupConfig = getQueryParam('config');
    loadState(startupConfig);
</script>
